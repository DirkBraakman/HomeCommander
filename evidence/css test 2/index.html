<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS test 2</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="hero">
      <h1>CSS test 2</h1>
      <p>Losse layouts, kleuren en wat animatie.</p>
    </header>

    <section class="block stack">
      <h2>probeersel 1: stapelen</h2>
      <div class="stack-cards">
        <div class="card">Box 1</div>
        <div class="card">Box 2</div>
        <div class="card">Box 3</div>
      </div>
    </section>

    <section class="block row-grid">
      <h2>probeersel 2: grid en hover</h2>
      <div class="grid">
        <div class="tile">A</div>
        <div class="tile">B</div>
        <div class="tile">C</div>
        <div class="tile">D</div>
      </div>
    </section>

    <section class="block flex-pics">
      <h2>probeersel 3: beelden en badges</h2>
      <div class="pics">
        <figure>
          <img src="jake.webp" alt="Jake" />
          <figcaption>Jake</figcaption>
        </figure>
        <figure>
          <img src="penguinwebp.webp" alt="Penguin" />
          <figcaption>Penguin</figcaption>
        </figure>
      </div>
    </section>

    <section class="block banner">
      <h2>probeersel 4: simpele animatie</h2>
      <div class="pulse">Klik hier</div>
    </section>
  </body>
</html>
